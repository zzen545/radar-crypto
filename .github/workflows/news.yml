name: Update berita

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/news.py", ".github/workflows/news.yml"]

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ambil berita dan hitung sentimen
        run: python tools/news.py > news.json && python -c "import json; d=json.load(open('news.json')); print(d['headlines'], 'judul;', 'gagal:', d['feeds_failed'])"
      - name: Simpan news.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || (git commit -m "Update berita" && git pull --rebase origin main && git push)
